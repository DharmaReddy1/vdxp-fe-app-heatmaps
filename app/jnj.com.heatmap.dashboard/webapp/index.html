<!DOCTYPE html>
<html>
	<head>
		<meta http-equiv="Cache-control" content="no-cache, no-store, must-revalidate" />

		<meta charset="utf-8" />

		<title>Risk Heatmap Dashboard</title>

		<script
			id="sap-ui-bootstrap"

			data-sap-ui-resource-roots='{
				"jnj.com.heatmap.dashboard": "./"
			}'
			data-sap-ui-libs="sap.m,sap.ui.core,sap.ui.layout"
			data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
			data-sap-ui-compat-version="edge"
			data-sap-ui-frame-options="allow"
			data-sap-ui-async="true"
		></script>
	</head>

	<body class="sapUiBody" style="margin:0;padding:0;overflow-x:hidden;">
			<div
				data-sap-ui-component
				data-name="jnj.com.heatmap.dashboard"
				style="width:100%;height:100vh;"
